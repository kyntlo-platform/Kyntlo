<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Customized Package | Kyntlo</title>
    <meta name="robots" content="noindex, follow">
    <meta http-equiv="refresh" content="0; url=contact.html#contact-form">
    <link rel="canonical" href="https://kyntlo.ai/contact">
    <link rel="icon" type="image/png" href="assets/favicon.png">
    <script>window.location.replace("contact.html#contact-form");</script>
    <!-- Google Analytics 4 (G-TPM67XPDR4).
         Consent Mode v2: every storage type starts denied. The Silktide consent
         manager in site-shell.js maps its Analytics and Marketing categories to
         these same signals, so acceptance is what turns tracking on - not page
         load. Removing the gtag('consent','default') block below would start
         tracking before the visitor has chosen, which is not valid consent. -->
    <script>
        window.dataLayer = window.dataLayer || [];
        function gtag(){dataLayer.push(arguments);}
        gtag('consent', 'default', {
            ad_storage: 'denied',
            ad_user_data: 'denied',
            ad_personalization: 'denied',
            analytics_storage: 'denied',
            wait_for_update: 500
        });
        gtag('js', new Date());
        gtag('config', 'G-TPM67XPDR4');
    </script>
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-TPM67XPDR4"></script>
</head>
<body style="margin:0;background:#07050f;color:#a49fb8;font:15px/1.6 system-ui,sans-serif">
    <p style="padding:40px">Taking you to the Customized checkout&hellip;
       <a href="contact.html#contact-form" style="color:#ff1aa3">Continue</a> if nothing happens.</p>
</body>
</html>
