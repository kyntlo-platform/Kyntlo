<!doctype html>
<html><head><meta charset="utf-8">
<link rel="stylesheet" href="../lib/kit.css">
<style>
  #stage { background: #05030c; font-family: var(--mono); }
  .floor { position: absolute; left: -600px; right: -600px; bottom: -200px; height: 900px; transform: perspective(500px) rotateX(62deg); transform-origin: bottom; background-image: linear-gradient(rgba(242,0,137,0.55) 2px, transparent 2px), linear-gradient(90deg, rgba(109,0,193,0.6) 2px, transparent 2px); background-size: 90px 90px; opacity: 0.45; }
  .scan { position: absolute; inset: 0; z-index: 30; pointer-events: none; background: repeating-linear-gradient(0deg, rgba(0,0,0,0.18) 0 2px, transparent 2px 5px); }
  .top { position: absolute; top: 110px; left: 50px; right: 50px; display: flex; justify-content: space-between; align-items: center; font-size: 30px; font-weight: 700; letter-spacing: 0.08em; }
  .top .live { color: #ff3355; }
  .cat { position: absolute; top: 170px; left: 50px; right: 50px; font-family: var(--display); font-weight: 800; font-size: 60px; letter-spacing: -0.02em; }
  .cat span { color: var(--hot); }
  #timer { position: absolute; top: 260px; left: 0; right: 0; text-align: center; font-size: 168px; font-weight: 800; letter-spacing: -0.05em; color: #3dff8b; text-shadow: 0 0 40px rgba(61,255,139,0.5); }
  #timer small { font-size: 0.5em; }
  #ffwd { position: absolute; top: 470px; left: 0; right: 0; text-align: center; font-size: 30px; font-weight: 700; letter-spacing: 0.2em; color: var(--muted); }
  .win { position: absolute; top: 540px; left: 50px; right: 50px; height: 520px; border: 3px solid rgba(255,255,255,0.15); border-radius: 26px; background: rgba(20,12,40,0.75); overflow: hidden; }
  .lvl { position: absolute; left: 0; top: 0; bottom: 0; width: 600px; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; padding: 0 30px; }
  .lvl .ic { font-size: 190px; line-height: 1; margin-bottom: 26px; }
  .lvl .nm { font-family: var(--display); font-weight: 800; font-size: 54px; letter-spacing: -0.02em; }
  .lvl .ds { font-size: 28px; color: var(--muted); margin-top: 12px; }
  .chat { position: absolute; right: 0; top: 0; bottom: 0; width: 380px; border-left: 2px solid rgba(255,255,255,0.1); padding: 20px 22px; display: flex; flex-direction: column; justify-content: flex-end; gap: 14px; font-family: var(--body); font-size: 27px; line-height: 1.25; }
  .chat b { font-weight: 800; }
  #count { position: absolute; inset: 0; display: grid; place-items: center; font-family: var(--display); font-weight: 900; font-size: 300px; z-index: 3; background: rgba(5,3,12,0.75); }
  .splits { position: absolute; top: 1100px; left: 50px; right: 50px; border-top: 3px solid rgba(255,255,255,0.15); }
  .sp { display: grid; grid-template-columns: 1fr 230px 230px; padding: 16px 20px; font-size: 34px; border-bottom: 1px solid rgba(255,255,255,0.08); }
  .sp .d { text-align: right; font-weight: 700; }
  .sp .tm { text-align: right; color: #d9d4ea; }
  .sp.cur { background: linear-gradient(90deg, rgba(242,0,137,0.35), rgba(109,0,193,0.25)); }
  .gold { color: #ffd23f !important; }
  .grn { color: #3dff8b; }
  #rec { position: absolute; top: 640px; left: 0; right: 0; text-align: center; z-index: 5; font-family: var(--display); font-weight: 900; font-size: 140px; line-height: 0.95; letter-spacing: -0.03em; color: #ffd23f; text-shadow: 0 0 60px rgba(255,210,63,0.8), 0 8px 0 #b3121f; }
  #conf i { position: absolute; width: 18px; height: 30px; z-index: 6; }
  #cmp { position: absolute; left: 50px; right: 50px; top: 1080px; z-index: 7; background: #0d0820; border: 3px solid var(--pink); border-radius: 30px; padding: 40px 46px; box-shadow: 0 30px 100px rgba(242,0,137,0.35); }
  #cmp .r { display: flex; justify-content: space-between; align-items: baseline; font-size: 36px; margin-bottom: 18px; }
  #cmp .r b { font-size: 58px; }
  #cmp .note { font-family: var(--body); font-size: 24px; color: var(--muted); margin-top: 10px; }
  #outro { position: absolute; inset: 0; z-index: 9; background: rgba(5,3,12,0.94); }
  #outro .cap { top: 700px; font-size: 100px; }
</style></head>
<body><div id="stage">
  <div class="floor" id="floor"></div>
  <div class="top"><span>KYNTLO% · ANY% · ATTEMPT #1</span><span class="live">● LIVE</span></div>
  <div class="cat">Lead <span>→</span> Booked Job</div>
  <div id="timer">0:00.<small>00</small></div>
  <div id="ffwd"></div>
  <div class="win">
    <div class="lvl" id="lvl"><div class="ic"></div><div class="nm"></div><div class="ds"></div></div>
    <div class="chat" id="chat"></div>
    <div id="count"></div>
  </div>
  <div class="splits" id="splits"></div>
  <div id="rec">NEW<br>RECORD!</div>
  <div id="conf"></div>
  <div id="cmp">
    <div class="r"><span>Previous best<br><small style="color:var(--muted)">doing it by hand</small></span><b style="color:#ff4d5e">2d 04:17</b></div>
    <div class="r"><span>This run<br><small style="color:var(--muted)">Kyntlo</small></span><b class="gold">1:48.02</b></div>
    <div class="note">*Illustrative run. Real times depend on your setup and your customer.</div>
  </div>
  <div id="outro"><div class="cap" id="oc">Your leads book<br>whoever replies<br><span class="g">first.</span></div></div>
  <div class="scan"></div>
</div>
<script src="../lib/kit.js"></script>
<script>
window.DURATION = 28;
window.BED = 'chip';
const END = 21.2;
const SPL = [
  // video time, game seconds, icon, name, description, delta vs by-hand
  [2.6, 0, '📝', 'Lead submits form', '"quote for a new bathroom?"', ''],
  [4.3, 4.12, '💬', 'Text-back sent', 'automatic. zero human input.', '−2h 46m'],
  [6.1, 51.3, '📱', 'Lead replies', '"yes, this week if possible"', '−5h 12m'],
  [7.9, 82.08, '🤖', 'AI qualifies', 'budget ✓ postcode ✓ timing ✓', '−9h 03m'],
  [9.7, 107.66, '📅', 'Slot booked', 'Thu 10:00, straight into the calendar', '−1d 06h'],
  [11.1, 107.9, '🔔', 'Reminder queued', 'day before, by text', '−1d 06h'],
  [12.3, 108.025, '⭐', 'Review request queued', 'goes out after the job', '−2d 04h'],
];
const CHAT = [[4.6, '#ff6ac1', 'dave_builds', 'wait it texted already??'], [6.5, '#7dd3fc', 'plumbr_pro', 'zero human inputs 💀'], [8.3, '#ffd23f', 'mia.k', 'the AI is cracked'],
  [10.0, '#3dff8b', 'ownerlife', "i'm still looking for my phone"], [11.5, '#ff6ac1', 'dave_builds', 'GG'], [12.5, '#c4b5fd', 'every1', 'W W W W W']];

const splits = K.$('#splits');
SPL.slice(1).forEach(([, , , name]) => {
  const r = document.createElement('div');
  r.className = 'sp';
  r.innerHTML = `<span>${name}</span><span class="d"></span><span class="tm">–</span>`;
  splits.appendChild(r);
});
const chat = K.$('#chat');
CHAT.forEach(([, c, u, m]) => { const d = document.createElement('div'); d.innerHTML = `<b style="color:${c}">${u}</b> ${m}`; chat.appendChild(d); });
const conf = K.$('#conf');
for (let i = 0; i < 90; i++) { const c = document.createElement('i'); c.style.background = ['#f20089', '#ffd23f', '#3dff8b', '#6d00c1', '#fff'][i % 5]; conf.appendChild(c); }

const fmt = (s) => { const m = Math.floor(s / 60), r = s - m * 60; return `${m}:${String(Math.floor(r)).padStart(2, '0')}.<small>${String(Math.floor((r % 1) * 100)).padStart(2, '0')}</small>`; };
function gameTime(t) {
  if (t < SPL[0][0]) return 0;
  for (let i = 1; i < SPL.length; i++) if (t < SPL[i][0]) return K.lerp(SPL[i - 1][1], SPL[i][1], (t - SPL[i - 1][0]) / (SPL[i][0] - SPL[i - 1][0]));
  return SPL[SPL.length - 1][1];
}

window.SFX = [[0.4, 'beep'], [1.0, 'beep'], [1.6, 'beep'], [2.2, 'go'], [12.4, 'confetti'], [14.4, 'whoosh'], [18.6, 'whoosh'], [END, 'boom']];
SPL.slice(1).forEach(([vt]) => window.SFX.push([vt, 'split']));
CHAT.forEach(([vt]) => window.SFX.push([vt, 'tick']));

window.renderFrame = (t) => {
  K.$('#floor').style.backgroundPosition = `0 ${t * 260}px`;
  // countdown
  const cnt = K.$('#count');
  const cIdx = Math.floor((t - 0.4) / 0.6);
  cnt.style.visibility = t >= 0.4 && t < 2.7 ? 'visible' : 'hidden';
  cnt.textContent = ['3', '2', '1', 'GO!'][K.clamp(cIdx, 0, 3)];
  const cp = ((t - 0.4) % 0.6) / 0.6;
  cnt.style.transform = `scale(${K.lerp(1.6, 1, K.out(K.clamp(cp * 2)))})`;
  cnt.style.color = cIdx >= 3 ? '#3dff8b' : '#fff';
  cnt.style.opacity = t < 0.4 ? 0 : 1;

  // timer
  const g = gameTime(t), done = t >= SPL[SPL.length - 1][0];
  const tm = K.$('#timer');
  tm.innerHTML = fmt(g);
  tm.className = done ? 'gold' : '';
  tm.style.color = done ? '#ffd23f' : '#3dff8b';
  let cur = 0; SPL.forEach(([vt], i) => { if (t >= vt) cur = i; });
  const next = SPL[Math.min(cur + 1, SPL.length - 1)];
  const speed = !done && t >= SPL[0][0] ? (next[1] - SPL[cur][1]) / (next[0] - SPL[cur][0]) : 0;
  K.$('#ffwd').textContent = speed > 2 ? `▶▶ TIMER ×${Math.round(speed)} (waiting on the customer)` : done ? 'FINAL TIME' : '';

  // level window
  const [vt, , ic, nm, ds] = SPL[cur];
  const lvl = K.$('#lvl');
  lvl.children[0].textContent = ic; lvl.children[1].textContent = nm; lvl.children[2].textContent = ds;
  K.pop(lvl, t, vt, { dy: 60, scale: 0.5 });
  lvl.style.visibility = t >= 2.6 ? 'visible' : 'hidden';
  K.$$('#chat div').forEach((d, i) => K.pop(d, t, CHAT[i][0], { dy: 30 }));

  // splits table
  K.$$('#splits .sp').forEach((r, i) => {
    const s = SPL[i + 1];
    const reached = t >= s[0];
    r.classList.toggle('cur', cur === i && !done || (!reached && cur === i));
    r.children[1].textContent = reached ? s[5] : '';
    r.children[1].className = 'd ' + (reached ? (i === 0 ? 'gold' : 'grn') : '');
    r.children[2].innerHTML = reached ? fmt(s[1]) : '–';
    r.style.opacity = reached || cur === i ? 1 : 0.55;
  });

  // record + confetti
  const rec = K.$('#rec');
  K.pop(rec, t, 12.4, { dy: 0, scale: 0.3, end: 14.2 });
  if (t > 12.4 && t < 14.2) rec.style.transform += ` rotate(${Math.sin(t * 14) * 3}deg)`;
  K.$$('#conf i').forEach((c, i) => {
    const age = t - 12.4 - K.rand(i) * 0.3;
    c.style.visibility = age > 0 && age < 3.5 ? 'visible' : 'hidden';
    const vx = (K.rand(i + 5) - 0.5) * 1400, vy = -900 - K.rand(i + 9) * 900;
    c.style.left = 540 + vx * age + 'px';
    c.style.top = 800 + vy * age + 1500 * age * age + 'px';
    c.style.transform = `rotate(${age * 720 * (K.rand(i) - 0.5)}deg)`;
  });
  K.pop(K.$('#cmp'), t, 14.4, { dy: 300, scale: 1, dur: 0.5 });
  const o = K.$('#outro');
  o.style.opacity = K.p(t, 18.6, 0.3);
  o.style.visibility = t >= 18.6 ? 'visible' : 'hidden';
  K.pop(K.$('#oc'), t, 18.7, { dy: 80 });

  K.endCard(t, END, { words: [['Be'], ['first.', 1], ['|'], ['Every'], ['lead.'], ['|'], ['Every'], ['time.']], sub: 'Text-back · AI qualifying · booking', cta: 'SPEEDRUN' });
};
window.SFX.push([END + 0.9 + 8 * 0.07 + 0.8, 'ding']);
renderFrame(0);
</script></body></html>
