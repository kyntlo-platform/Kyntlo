<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Kyntlo Academy card</title>
<style>
  :root { --pink:#f20089; --purple:#6d00c1; --ink:#120b1f; --paper:#f7f4fb; --muted:#5d5470; }
  * { box-sizing:border-box; margin:0; }
  html, body { width:100%; height:100%; overflow:hidden; background:var(--paper); }
  body { font-family:'Space Grotesk', Inter, system-ui, sans-serif; color:var(--ink); }
  .blob { position:absolute; border-radius:50%; filter:blur(90px); opacity:.55; animation:drift 14s ease-in-out infinite alternate; }
  .b1 { width:820px; height:820px; background:#ff5fb8; left:-240px; top:-300px; }
  .b2 { width:760px; height:760px; background:#9b4dff; right:-220px; bottom:-320px; animation-delay:-5s; }
  .b3 { width:420px; height:420px; background:#ffc2e3; right:22%; top:-120px; animation-delay:-9s; }
  @keyframes drift { to { transform:translate(60px,40px) scale(1.08); } }
  .grid { position:absolute; inset:0; background-image:linear-gradient(rgba(18,11,31,.05) 1px,transparent 1px),linear-gradient(90deg,rgba(18,11,31,.05) 1px,transparent 1px); background-size:64px 64px; mask-image:radial-gradient(ellipse at center,#000 30%,transparent 75%); }
  .stage { position:absolute; inset:0; display:flex; flex-direction:column; justify-content:center; padding:0 9vw; }
  .logo { height:9vh; width:auto; align-self:flex-start; margin-bottom:5vh; }
  .kicker { display:inline-flex; align-self:flex-start; gap:.6em; align-items:center; font-size:2.6vh; font-weight:700; letter-spacing:.14em; text-transform:uppercase; color:#fff; background:linear-gradient(90deg,var(--pink),var(--purple)); padding:1.1vh 2.2vh; border-radius:999px; }
  h1 { font-size:8.4vh; line-height:1.04; font-weight:800; letter-spacing:-.02em; margin-top:3.2vh; max-width:15em; }
  h1 em { font-style:normal; background:linear-gradient(90deg,var(--pink),var(--purple)); -webkit-background-clip:text; background-clip:text; color:transparent; }
  .sub { font-size:3.3vh; color:var(--muted); margin-top:2.6vh; max-width:34em; line-height:1.4; font-family:Inter, system-ui, sans-serif; }
  .bar { height:.7vh; width:0; background:linear-gradient(90deg,var(--pink),var(--purple)); border-radius:9px; margin-top:4.4vh; }
  .plan { align-self:flex-start; margin-top:3.4vh; font-size:2.3vh; font-weight:700; color:var(--purple); border:2px solid currentColor; padding:.8vh 1.8vh; border-radius:999px; font-family:Inter, system-ui, sans-serif; }
  .cta { align-self:flex-start; margin-top:4.6vh; font-size:3.2vh; font-weight:700; color:#fff; background:var(--ink); padding:2vh 3.6vh; border-radius:16px; box-shadow:0 18px 40px rgba(18,11,31,.25); }
  .cta span { color:#ff5fb8; }
  .corner { position:absolute; right:4vw; bottom:4vh; font-size:2.2vh; color:var(--muted); font-weight:600; letter-spacing:.06em; }

  /* Entrance choreography, started by __kyPlay() so it lands on camera. */
  .in { opacity:0; transform:translateY(3vh); }
  .play .in { animation:rise .8s cubic-bezier(.2,.8,.2,1) forwards; }
  .play .bar { animation:grow 1.1s .7s cubic-bezier(.2,.8,.2,1) forwards; }
  .play .d1 { animation-delay:.1s } .play .d2 { animation-delay:.3s } .play .d3 { animation-delay:.5s } .play .d4 { animation-delay:.75s } .play .d5 { animation-delay:1s }
  @keyframes rise { to { opacity:1; transform:none; } }
  @keyframes grow { to { width:22vw; } }

  .chapter .stage { align-items:flex-start; }
  .chapter h1 { font-size:10vh; }
  .thumb h1 { font-size:11vh; max-width:11em; }
  .thumb .in { opacity:1; transform:none; }
  .thumb .bar { width:22vw; }
</style>
</head>
<body>
<div class="blob b1"></div><div class="blob b2"></div><div class="blob b3"></div>
<div class="grid"></div>
<div class="stage">
  <img class="logo in d1" src="../../../assets/kyntlo-logo-cropped.png" alt="Kyntlo">
  <div class="kicker in d2" id="kicker"></div>
  <h1 class="in d3" id="title"></h1>
  <div class="sub in d4" id="sub"></div>
  <div class="plan in d5" id="plan"></div>
  <div class="bar"></div>
  <div class="cta in d5" id="cta"></div>
</div>
<div class="corner in d5" id="corner">KYNTLO ACADEMY</div>
<script>
  const q = new URLSearchParams(location.search);
  const type = q.get('type') || 'intro';
  document.body.classList.add(type);
  const set = (id, v, html) => {
    const el = document.getElementById(id);
    if (!v) return el.remove();
    // *word* renders in brand gradient.
    if (html) el.innerHTML = v.replace(/[&<>]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;' })[c]).replace(/\*(.+?)\*/g, '<em>$1</em>');
    else el.textContent = v;
  };
  set('kicker', q.get('kicker'));
  set('title', q.get('title'), true);
  set('sub', q.get('sub'));
  const plans = { ALL: 'Included in every plan', 'GROWTH+': 'Growth & Pro plans', PRO: 'Pro plan', 'ADD-ON': 'Paid add-on' };
  set('plan', plans[q.get('plan')] || q.get('plan'));
  // [text] in the call to action renders in brand pink.
  set('cta', q.get('cta'));
  const cta = document.getElementById('cta');
  if (cta) cta.innerHTML = cta.innerHTML.replace(/\[(.+?)\]/g, '<span>$1</span>');
  if (type === 'chapter') document.querySelector('.logo').remove();
  window.__kyPlay = () => document.body.classList.add('play');
  if (type === 'thumb') __kyPlay();
</script>
</body>
</html>
